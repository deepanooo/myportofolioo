<button type="button" class="project-delete-trigger" popovertarget="delete-experience-{{ experience.id }}">Hapus</button>
<div id="delete-experience-{{ experience.id }}" class="project-delete-modal" popover="auto" aria-labelledby="delete-experience-title-{{ experience.id }}">
    <button type="button" class="project-delete-modal__backdrop" popovertarget="delete-experience-{{ experience.id }}" popovertargetaction="hide" aria-label="Tutup konfirmasi"></button>
    <div class="project-delete-modal__content">
        <button type="button" class="project-delete-modal__close" popovertarget="delete-experience-{{ experience.id }}" popovertargetaction="hide" aria-label="Tutup">×</button>
        <h2 id="delete-experience-title-{{ experience.id }}">Hapus pengalaman?</h2>
        <p>Apakah Anda yakin ingin menghapus <strong>{{ experience.title }}</strong>?</p>
        <div class="project-delete-modal__actions">
            <button type="button" class="button button-outline" popovertarget="delete-experience-{{ experience.id }}" popovertargetaction="hide">Batal</button>
            <form method="post" action="{% url 'main:delete_experience' experience.id %}">
                {% csrf_token %}
                <button type="submit" class="button button-danger">Ya, hapus</button>
            </form>
        </div>
    </div>
</div>
